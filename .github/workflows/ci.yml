name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,postgres,llm]"
      - run: ruff check src tests
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - name: Translation catalogs (placeholders, extracted keys)
        run: npm run i18n:check
      - run: npm run build
      - name: Static build (GitHub Pages)
        run: npm run build
        env: {VITE_STATIC: "1", EW_BASE_PATH: /ebola-watch/}
