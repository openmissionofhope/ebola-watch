# Gazetteer for geocoding official and unofficial text.
#
# Country names are loaded from data/boundaries/admin0.geojson (Natural Earth);
# this file adds aliases and spelling variants (including local-language and
# transliterated forms) and maps population centres to the first-level
# administrative unit used for public outputs. Coordinates are deliberately not
# stored here: places are resolved to administrative units, never to points.
#
# region codes: ISO 3166-1 alpha-3 for countries; ISO 3166-2 for admin-1 units.

country_aliases:
  COD: ["Democratic Republic of the Congo", "Democratic Republic of Congo", "Dem. Rep. Congo", "DR of Congo", "DR Congo", "DRC", "D.R.C.", "RDC", "R.D.C.", "RD Congo",
