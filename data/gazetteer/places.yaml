        "Jamhuri ya Kidemokrasia ya Kongo", "Kongo ya Kidemokrasia", "Republiki ya Kidemokrasi ya Kongo",
        "República Democrática do Congo", "Zaïre", "Zaire", "جمهورية الكونغو الديمقراطية", "الكونغو الديمقراطية"]
