# Corridor-level multimodal connectivity between administrative units.
#
# Public-safety design: nodes are administrative units (admin-1 or country),
# never facilities, stations, ports or border posts. Edges describe broad
# corridors and carry no route geometry.
#
# Status vocabulary (see ebolawatch.domain.enums):
#   physical_status: documented | unverified
#   service_status:  operational | intermittent | seasonal | suspended | non_operational | unknown
#   verification:    official | secondary | mapped_only | unverified
#
# Nothing here asserts that a passenger service currently runs unless
# service_status says so with a source. Most entries are deliberately
# "unknown": the model treats unknown services as scenarios (closed / partial /
# open), never as operating. Operators update statuses through the admin API,
# which keeps an append-only history with the evidence for each change.
version: "2026.10.1"
