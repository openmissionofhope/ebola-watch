# Outbreak registry. Each entry cites the official source of its declaration
# (and end, where declared). The pipeline links observations to an outbreak by
# country, pathogen and date. Add new outbreaks here as they are declared, or
# let the WHO DON connector propose them for review. `replaces` adopts a record
# the pipeline auto-registered (keeping its linked figures) and settles its
# pending review.
