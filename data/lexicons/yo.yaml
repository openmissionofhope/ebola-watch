notes: Draft for south-western Nigeria (standard Yoruba). Online text often omits tone marks and subdots; matching is accent-folded, so à/ẹ/ọ/ṣ also match a/e/o/s. Folding merges some tonal homographs (àrùn 'disease' / àrún 'five', ẹ̀jẹ̀ 'blood' / èje 'seven', ibà 'fever' / ìbá 'would'), so single-word terms can over-match; bare kú 'die' is left out because it occurs in greetings (ẹ kú àárọ̀). Native-speaker review welcome.
