[project]
name = "ebolawatch"
version = "0.1.0"
description = "Ebola Watch: ethical, evidence-based, multilingual Ebola outbreak monitoring, estimation and forecasting (Open Mission of Hope)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Open Mission of Hope" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]
geo = ["shapely>=2.0"]
llm = ["anthropic>=1.0"]

[project.scripts]
ebolawatch = "ebolawatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebolawatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "live: tests that contact real external services (run with -m live)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
